<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png">
    <meta charset="UTF-8">
    <title>SRI CUMIN SEEDS CATERING SERVICES</title>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (token && user) {
            if (user.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'menu.html';
            }
        } else {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body>
  <div class="parotta-loader-wrapper" id="parotta-loader">
    <img src="parotta.png" alt="Loading..." class="spinning-parotta">
    <div class="loader-text">Cooking...</div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('parotta-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
    <p style="text-align: center; margin-top: 2rem; font-family: sans-serif;">Redirecting...</p>
</body>

</html>
