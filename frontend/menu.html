<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu — SRI CUMIN SEEDS CATERING SERVICES</title>
  <meta name="description" content="Order fresh canteen food online. Browse today's menu, add to cart and pay via UPI.">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="parotta-loader-wrapper" id="parotta-loader">
    <img src="parotta.png" alt="Loading..." class="spinning-parotta">
    <div class="loader-text">Cooking...</div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('parotta-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  <header>
    <a href="index.html" class="logo"><img src="logo.png" alt="Logo" class="logo-img"> SRI CUMIN SEEDS CATERING
      SERVICES</a>
    <nav>
      <a href="menu.html" class="active">Menu</a>
    </nav>
  </header>

  <div class="container menu-layout">
    <main>
      <div class="menu-header-bar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1.5rem;width:100%;">
        <div>
          <h2>Today's Menu</h2>
          <p style="color:var(--text-muted);">Freshly prepared for you.</p>
        </div>
        <div class="controls-container" style="display:flex;gap:1rem;flex-grow:1;max-width:850px;justify-content:flex-end;align-items:center;flex-wrap:wrap;">
          <!-- Search Box -->
          <div class="search-box" style="position:relative;flex-grow:2;max-width:400px;min-width:260px;">
            <input type="text" id="menu-search" placeholder="Search for food..."
              style="width:100%;padding:0.75rem 1rem;padding-left:2.5rem;border:2px solid var(--text-main);border-radius:30px;font-family:inherit;">
            <i class="fa-solid fa-magnifying-glass"
              style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);"></i>
          </div>
          <!-- Sort by Price -->
          <div class="sort-group" style="position:relative;">
            <select id="menu-sort" style="height:46px;padding:0 2.5rem 0 1.5rem;border:2px solid var(--text-main);border-radius:30px;font-family:inherit;font-weight:600;background:#fff;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;">
              <option value="default">Sort by: Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
            <i class="fa-solid fa-chevron-down" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted);"></i>
          </div>
        </div>
      </div>
      <div class="items-grid" id="menu-grid">
        <!-- Menu items injected by app.js -->
      </div>
    </main>

    <aside>
      <div class="cart-panel glass-panel" id="cart-panel">
        <span class="close-cart-btn" id="close-cart-btn">&times;</span>
        <h3 class="cart-header"><i class="fa-solid fa-basket-shopping"></i> Your Cart</h3>
        <div class="cart-items" id="cart-items">
          <p style="color:var(--text-muted);text-align:center;margin-top:2rem;">Cart is empty</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total">
            <span>Total</span>
            <span id="cart-total">₹0</span>
          </div>
          <button class="btn btn-primary btn-add" id="checkout-btn" disabled>Proceed to Pay</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://static.zohocdn.com/zpay/zpay-js/v1/zpayments.js"></script>

  <div class="cart-overlay" id="cart-overlay"></div>
  <button id="floating-cart-btn" class="floating-cart-btn">
    <i class="fa-solid fa-basket-shopping"></i>
    <span id="floating-cart-count" class="cart-badge">0</span>
  </button>

  <footer
    style="text-align: center; margin-top: 4rem; padding: 2rem; border-top: 2px solid var(--text-main); background: #ffffff; font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem;">
    <a href="terms.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Terms &amp;
      Conditions</a>
    <a href="privacy.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Privacy Policy</a>
    <a href="refunds.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Cancellation &amp;
      Refunds</a>
    <a href="contact.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Contact Us</a>
  </footer>

  <script src="js/app.js"></script>
</body>

</html>
