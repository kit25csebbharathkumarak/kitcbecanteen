<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Canteen Express</title>
  <meta name="description" content="Order fresh canteen food online. Browse today's menu, add to cart and pay via UPI.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-utensils"></i> Canteen Express</a>
    <nav>
      <a href="menu.html" class="active">Menu</a>
    </nav>
  </header>

  <div class="container menu-layout">
    <main>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
        <div>
          <h2>Today's Menu</h2>
          <p style="color:var(--text-muted);">Freshly prepared for you.</p>
        </div>
        <div class="search-box" style="position:relative;min-width:300px;">
          <input type="text" id="menu-search" placeholder="Search for food..."
            style="width:100%;padding:0.75rem 1rem;padding-left:2.5rem;border:2px solid var(--text-main);border-radius:var(--border-radius);font-family:inherit;">
          <i class="fa-solid fa-magnifying-glass"
            style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);"></i>
        </div>
      </div>
      <div class="items-grid" id="menu-grid">
        <!-- Menu items injected by app.js -->
      </div>
    </main>

    <aside>
      <div class="cart-panel glass-panel">
        <h3 class="cart-header"><i class="fa-solid fa-basket-shopping"></i> Your Cart</h3>
        <div class="cart-items" id="cart-items">
          <p style="color:var(--text-muted);text-align:center;margin-top:2rem;">Cart is empty</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total">
            <span>Total</span>
            <span id="cart-total">₹0</span>
          </div>
          <button class="btn btn-primary btn-add" id="checkout-btn" disabled>Proceed to Pay</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  Razorpay Payment Modal                                                 -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div class="modal" id="razorpay-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-razorpay-modal">&times;</span>
      <h3><i class="fa-solid fa-credit-card" style="color: var(--primary-color);"></i> Complete Your Payment</h3>
      <p style="margin-top: 1rem; color: var(--text-muted);">Pay securely to place your order.</p>
      
      <div style="font-size: 1.8rem; font-weight: 700; color: var(--text-main); margin: 1.5rem 0;">
        <span id="razorpay-amount-display">₹0</span>
      </div>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">
        Order ID: <strong id="razorpay-order-id-display" style="font-family: monospace; color: var(--text-main);"></strong>
      </p>

      <div style="display: flex; justify-content: center; align-items: center; min-height: 60px;">
        <form id="razorpay-form" action="/api/orders/razorpay-callback" method="POST">
          <input type="hidden" name="orderId" id="razorpay-order-id-input" value="">
          <script src="https://checkout.razorpay.com/v1/payment-button.js" data-payment_button_id="pl_T5TM9wj2vOb5eA" async> </script>
        </form>
      </div>
      
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1.5rem;">
        Secure payment processed by Razorpay.
      </p>
    </div>
  </div>



  <footer style="text-align: center; margin-top: 4rem; padding: 2rem; border-top: 2px solid var(--text-main); background: #ffffff; font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem;">
    <a href="terms.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Terms &amp; Conditions</a>
    <a href="privacy.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Privacy Policy</a>
    <a href="refunds.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Cancellation &amp; Refunds</a>
    <a href="contact.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Contact Us</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
