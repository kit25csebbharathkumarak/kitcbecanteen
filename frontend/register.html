<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Canteen Express</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-box">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <p id="error-msg" style="color: red; font-size: 0.9rem; display: none;"></p>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
