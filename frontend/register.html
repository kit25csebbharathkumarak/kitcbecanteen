<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - SRI CUMIN SEEDS CATERING SERVICES</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-box">
      <div style="text-align: center; margin-bottom: 1rem;">
        <img src="logo.png" alt="Logo" style="max-height: 150px; width: auto; object-fit: contain;">
      </div>
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group" id="otp-group" style="display: none;">
          <label>Verification Code (OTP)</label>
          <input type="text" id="otp" placeholder="Enter 6-digit code">
        </div>
        <p id="info-msg" style="color: green; font-size: 0.9rem; display: none; margin-bottom: 0.5rem;"></p>
        <p id="error-msg" style="color: red; font-size: 0.9rem; display: none;"></p>
        <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <footer style="text-align: center; margin-top: auto; padding: 2rem; border-top: 2px solid var(--text-main); background: #ffffff; font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; width: 100%;">
    <a href="terms.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Terms &amp; Conditions</a>
    <a href="privacy.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Privacy Policy</a>
    <a href="refunds.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Cancellation &amp; Refunds</a>
    <a href="contact.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Contact Us</a>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
