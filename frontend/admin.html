<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Canteen Express</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-utensils"></i> Admin Dashboard</a>
    <nav>
      <a href="menu.html">View Menu</a>
    </nav>
  </header>

  <div class="container admin-layout">
    <aside class="scanner-section">
      <div class="glass-panel" style="padding: 1.5rem;">
        <h3><i class="fa-solid fa-qrcode"></i> Scan Order QR</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Scan the student's QR code to verify and fulfill.</p>
        <div id="reader"></div>
      </div>
      
      <div>
        <div class="glass-panel" style="padding: 1.5rem; margin-top: 2rem; margin-bottom: 2rem;">
          <h3 style="margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem;">Add Menu Item</h3>
          <form id="add-item-form">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="new-item-name" required>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" id="new-item-image" required placeholder="https://example.com/image.jpg">
            </div>
            <div style="display: flex; gap: 1rem;">
              <div class="form-group" style="flex: 1;">
                <label>Price (₹)</label>
                <input type="number" id="new-item-price" required>
              </div>
              <div class="form-group" style="flex: 1;">
                <label>Available</label>
                <select id="new-item-avail" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px;">
                  <option value="1">Yes</option>
                  <option value="0">No</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Add Item</button>
          </form>
        </div>

        <div class="glass-panel" style="padding: 1.5rem;">
          <h3 style="margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem;">Item Sales Statistics</h3>
          <div id="item-stats" style="max-height: 400px; overflow-y: auto;">
            <!-- Item statistics will be loaded here -->
          </div>
          <div id="total-revenue-stat" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 2px solid rgba(229, 57, 53, 0.2); font-size: 1.2rem; font-weight: 700; color: var(--primary-color);">
            Total Revenue: ₹0.00
          </div>
        </div>

        <div class="glass-panel" style="padding: 1.5rem;">
          <h3 style="margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem;">Manage Menu</h3>
          <div id="admin-menu-list"></div>
        </div>
      </div>
    </aside>

    <main>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;">
        <h2>Live Orders</h2>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <div class="search-box" style="position: relative; flex: 1; min-width: 250px;">
            <input type="text" id="order-search" placeholder="Search Order ID..." style="width: 100%; padding: 0.75rem 1rem; padding-left: 2.5rem; border: 1px solid #ddd; border-radius: 50px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          </div>
          <button id="clear-delivered-btn" class="btn btn-danger">Clear Delivered</button>
        </div>
      </div>

      <!-- Recently Scanned Highlight -->
      <div id="recently-scanned-container" style="display: none; margin-bottom: 2rem; animation: slideInDown 0.5s ease-out;">
        <div class="glass-panel" style="padding: 1.5rem; border: 2px solid var(--primary-color); background: rgba(229, 57, 53, 0.05);">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 style="color: var(--primary-color); margin-bottom: 1rem;"><i class="fa-solid fa-circle-check"></i> Recently Scanned</h3>
            <button class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; background: transparent; color: var(--text-muted);" onclick="document.getElementById('recently-scanned-container').style.display='none'">Dismiss</button>
          </div>
          <div id="scanned-order-details"></div>
        </div>
      </div>

      <div class="orders-board" id="orders-board">
        <!-- Live orders injected by JS -->
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
