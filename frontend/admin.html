<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - SRI CUMIN SEEDS CATERING SERVICES</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <header>
    <a href="admin.html" class="logo"><i class="fa-solid fa-utensils"></i> Admin Dashboard</a>
    <nav id="admin-nav">
      <a href="admin.html" class="active">Dashboard</a>
      <a href="admin-menu.html">Manage Menu</a>
      <a href="admin-stats.html">Sales Statistics</a>
    </nav>
  </header>

  <div class="container admin-layout">
    <aside class="scanner-section">
      <div class="glass-panel" style="padding: 1.5rem;">
        <h3><i class="fa-solid fa-qrcode"></i> Scan Order QR</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Scan the student's QR code to verify and fulfill.</p>
        <div id="reader"></div>
      </div>

      <!-- Quick Stats Card -->
      <div class="glass-panel" style="padding: 1.5rem; margin-top: 2rem; border-left: 5px solid var(--primary-color);">
        <h4 style="margin-bottom: 0.5rem;">Admin Quick Links</h4>
        <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;">
            <a href="admin-menu.html" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.5rem;"><i class="fa-solid fa-plus"></i> Add New Items</a>
            <a href="admin-stats.html" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.5rem;"><i class="fa-solid fa-chart-simple"></i> View Sales Data</a>
        </div>
      </div>
    </aside>

    <main>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;">
        <h2>Live Orders</h2>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <div class="search-box" style="position: relative; flex: 1; min-width: 250px;">
            <input type="text" id="order-search" placeholder="Search Order ID..." style="width: 100%; padding: 0.75rem 1rem; padding-left: 2.5rem; border: 2px solid var(--text-main); border-radius: var(--border-radius);">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          </div>
          <button id="clear-delivered-btn" class="btn btn-danger">Clear Delivered</button>
        </div>
      </div>

      <!-- Recently Scanned Highlight -->
      <div id="recently-scanned-container" style="display: none; margin-bottom: 2rem; animation: slideInDown 0.5s ease-out;">
        <div class="glass-panel" style="padding: 1.5rem; border: 2px solid var(--primary-color); background: rgba(229, 57, 53, 0.05);">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 style="color: var(--primary-color); margin-bottom: 1rem;"><i class="fa-solid fa-circle-check"></i> Recently Scanned</h3>
            <button class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; background: transparent; color: var(--text-muted);" onclick="document.getElementById('recently-scanned-container').style.display='none'">Dismiss</button>
          </div>
          <div id="scanned-order-details"></div>
        </div>
      </div>

      <div class="orders-board" id="orders-board">
        <!-- Live orders injected by JS -->
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
