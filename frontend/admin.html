<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - SRI CUMIN SEEDS CATERING SERVICES</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>
  <div class="parotta-loader-wrapper" id="parotta-loader">
    <img src="parotta.png" alt="Loading..." class="spinning-parotta" style="width: 30px; height: 30px;">
    <div class="loader-text">Cooking...</div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('parotta-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  <header>
    <a href="admin.html" class="logo"><img src="logo.png" alt="Logo" class="logo-img"> Admin Dashboard</a>
    <nav id="admin-nav">
      <a href="admin.html" class="active">Dashboard</a>
      <a href="admin-menu.html">Manage Menu</a>
      <a href="admin-stats.html">Sales Statistics</a>
    </nav>
  </header>

  <div class="container admin-layout">
    <aside class="scanner-section">
      <div class="glass-panel" style="padding: 1.5rem;">
        <h3><i class="fa-solid fa-qrcode"></i> Scan Order QR</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Scan the student's QR code to
          verify and fulfill.</p>
        <div id="reader"></div>
      </div>

      <!-- Quick Stats Card -->
      <div class="glass-panel" style="padding: 1.5rem; margin-top: 2rem; border-left: 5px solid var(--primary-color);">
        <h4 style="margin-bottom: 0.5rem;">Admin Quick Links</h4>
        <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;">
          <a href="admin-menu.html" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.5rem;"><i
              class="fa-solid fa-plus"></i> Add New Items</a>
          <a href="admin-stats.html" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.5rem;"><i
              class="fa-solid fa-chart-simple"></i> View Sales Data</a>
        </div>
      </div>
    </aside>

    <main>
      <div
        style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;">
        <h2>Live Orders</h2>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <div class="search-box" style="position: relative; flex: 1; min-width: 250px;">
            <input type="text" id="order-search" placeholder="Search Order ID..."
              style="width: 100%; padding: 0.75rem 1rem; padding-left: 2.5rem; border: 2px solid var(--text-main); border-radius: 30px; font-family: inherit;">
            <i class="fa-solid fa-magnifying-glass"
              style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          </div>
          <button id="clear-delivered-btn" class="btn btn-danger">Clear Delivered</button>
        </div>
      </div>

      <!-- Recently Scanned Highlight Modal -->
      <div id="recently-scanned-container"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; animation: fadeIn 0.3s ease;">
        <div class="glass-panel"
          style="background: #fff; padding: 3rem; border-radius: 20px; max-width: 800px; width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: slideInDown 0.4s ease-out;">
          <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; font-size: 2.5rem;">
            <i class="fa-solid fa-qrcode"></i> Order Scanned
          </h2>
          <div id="scanned-order-details" style="font-size: 1.3rem; text-align: left; margin-bottom: 2rem;"></div>
          <button class="btn btn-primary"
            style="font-size: 1.2rem; padding: 1rem 3rem; border-radius: 30px; width: 100%;"
            onclick="document.getElementById('recently-scanned-container').style.display='none'">Dismiss (Auto-closing)</button>
        </div>
      </div>

      <div class="orders-board" id="orders-board">
        <!-- Live orders injected by JS -->
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>

</html>
