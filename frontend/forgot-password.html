<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Canteen Express</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-box">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Reset Password</h2>
      <form id="forgot-form">
        <div class="form-group">
          <label>Enter your registered Email</label>
          <input type="email" id="forgot-email" required>
        </div>
        <p id="forgot-msg" style="color: green; font-size: 0.9rem; display: none;"></p>
        <p id="forgot-error-msg" style="color: red; font-size: 0.9rem; display: none;"></p>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem;">
        Remembered it? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>
  <script src="js/forgot.js"></script>
</body>
</html>
